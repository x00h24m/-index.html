<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Archivo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
    }

    header {
      padding: 25px;
      border-bottom: 1px solid #222;
    }

    header h1 {
      font-size: 30px;
    }

    header p {
      color: #aaa;
      margin-top: 7px;
    }

    main {
      padding: 30px 20px;
      max-width: 900px;
      margin: auto;
    }

    .welcome {
      margin-bottom: 30px;
    }

    .welcome h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #247cff;
    }

    .icon {
      font-size: 35px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 17px;
    }

    .upload {
      margin-top: 30px;
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #247cff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .upload:hover {
      background: #1765d1;
    }

    .green {
      color: #31d158;
    }
  </style>
</head>

<body>

  <header>
    <h1>Mi Archivo</h1>
    <p>Tu espacio personal en Internet</p>
  </header>

  <main>

    <section class="welcome">
      <h2>Bienvenido 👋</h2>
      <p class="green">Todo lo que necesitas, en un solo lugar.</p>
    </section>

    <section class="cards">

      <div class="card">
        <div class="icon">📸</div>
        <h3>Fotos</h3>
      </div>

      <div class="card">
        <div class="icon">📝</div>
        <h3>Notas</h3>
      </div>

      <div class="card">
        <div class="icon">📄</div>
        <h3>Archivos</h3>
      </div>

      <div class="card">
        <div class="icon">🔗</div>
        <h3>Enlaces</h3>
      </div>

    </section>

    <button class="upload">
      ＋ Subir algo
    </button>

  </main>

</body>
</html>
