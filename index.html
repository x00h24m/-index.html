<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Archivo</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

header {
  padding: 25px;
  border-bottom: 1px solid #222;
}

h1 {
  margin: 0;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 35px 20px;
}

h2 {
  font-size: 30px;
}

.subtitle {
  color: #31d158;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-top: 30px;
}

.card {
  background: #151515;
  border: 1px solid #292929;
  border-radius: 16px;
  padding: 30px 15px;
  text-align: center;
}

.icon {
  font-size: 40px;
}

.card h3 {
  margin-bottom: 0;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 17px;
  border: 0;
  border-radius: 12px;
  background: #247cff;
  color: white;
  font-size: 17px;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
  <h1>Mi Archivo</h1>
  <p>Tu espacio personal</p>
</header>

<main>

  <h2>Bienvenido 👋</h2>
  <p class="subtitle">Todo lo que necesitas, en un solo lugar.</p>

  <div class="cards">

    <div class="card">
      <div class="icon">📸</div>
      <h3>Fotos</h3>
    </div>

    <div class="card">
      <div class="icon">📝</div>
      <h3>Notas</h3>
    </div>

    <div class="card">
      <div class="icon">📄</div>
      <h3>Archivos</h3>
    </div>

    <div class="card">
      <div class="icon">🔗</div>
      <h3>Enlaces</h3>
    </div>

  </div>

  <button>＋ Subir algo</button>

</main>

</body>
</html>
